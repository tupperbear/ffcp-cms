services:
    directus:
        image: directus/directus:11.5.1
        ports:
            - 8055
        volumes:
            - directus_uploads:/directus/uploads
            - directus_templates:/directus/templates
            - directus_extensions:/directus/extensions
        networks:
            - dokploy-network
        environment:
            # General
            SECRET: ${DIRECTUS_SECRET}
            PUBLIC_URL: ${DIRECTUS_PUBLIC_URL}

            # Database
            DB_CLIENT: "pg"
            DB_CONNECTION_STRING: ${DATABASE_URL}
            
            #Cache
            CACHE_ENABLED: "true"
            CACHE_AUTO_PURGE: "true"
            CACHE_STORE: "memory"

            # Admin user
            ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
            ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}

            # Notifications
            EMAIL_FROM: ${EMAIL_FROM}
            EMAIL_TRANSPORT: "smtp"
            EMAIL_SMTP_HOST: ${EMAIL_HOST}
            EMAIL_SMTP_PORT: ${EMAIL_PORT}
            EMAIL_SMTP_USER: ${EMAIL_USER}
            EMAIL_SMTP_PASSWORD: ${EMAIL_PASSWORD}

            # Storage
            STORAGE_LOCATIONS: "local"

            # R2 Assets (r2a)
            # STORAGE_R2A_DRIVER: "s3"
            # STORAGE_R2A_KEY: ${R2A_KEY}
            # STORAGE_R2A_SECRET: ${R2A_SECRET}
            # STORAGE_R2A_BUCKET: ${R2A_BUCKET}
            # STORAGE_R2A_REGION: ${R2A_REGION}
            # STORAGE_R2A_ENDPOINT: ${R2A_ENDPOINT}

            # R2 Extensions (r2e)
            # STORAGE_R2E_DRIVER: "s3"
            # STORAGE_R2E_KEY: ${R2E_KEY}
            # STORAGE_R2E_SECRET: ${R2E_SECRET}
            # STORAGE_R2E_BUCKET: ${R2E_BUCKET}
            # STORAGE_R2E_REGION: ${R2E_REGION}
            # STORAGE_R2E_ENDPOINT: ${R2E_ENDPOINT}

            # Extensions
            EXTENSIONS_LOCATION: "local"
            EXTENSIONS_AUTO_RELOAD: true
            MARKETPLACE_TRUST: "all"

            # CSP - allow external images from R2 and previews from our preview build
            CONTENT_SECURITY_POLICY_DIRECTIVES__IMG_SRC: "array:'self',data:,blob:,https://raw.githubusercontent.com,https://avatars.githubusercontent.com,i.vimeocdn.com 'unsafe-eval',i.ytimg.com 'unsafe-eval'"
            CONTENT_SECURITY_POLICY_DIRECTIVES__FRAME_SRC: "https://ffcp-website-preview.netlify.app,https://www.youtube-nocookie.com,https://player.vimeo.com,http://localhost:4321"
            CONTENT_SECURITY_POLICY_DIRECTIVES__SCRIPT_SRC: "array:'self', player.vimeo.com 'unsafe-eval', www.youtube.com 'unsafe-eval', www.youtube.com/iframe_api 'unsafe-eval'"
            # CONTENT_SECURITY_POLICY_DIRECTIVES__IMG_SRC: "array:'self' data:, i.ytimg.com 'unsafe-eval'"
            CONTENT_SECURITY_POLICY_DIRECTIVES__MEDIA_SRC: "array:'self', cdn.plyr.io"

            # Misc
            ASSETS_TRANSFORM_IMAGE_MAX_DIMENSION: 9000
            WEBSOCKETS_ENABLED: true
            TELEMETRY: false

volumes:
    directus_uploads:
    directus_templates:
    directus_extensions:

networks:
    dokploy-network:
        external: true